name: Render decoder regression
on:
  push:
    paths:
      - 'vita3k/renderer/src/texture/format.cpp'
      - 'vita3k/renderer/src/texture/cache.cpp'
      - 'vita3k/renderer/src/vulkan/surface_cache.cpp'
      - 'vita3k/renderer/src/vulkan/context.cpp'
      - 'vita3k/renderer/src/vulkan/creation.cpp'
      - 'vita3k/renderer/src/vulkan/scene.cpp'
      - 'vita3k/renderer/include/renderer/vulkan/types.h'
      - 'vita3k/shader/**'
      - 'vita3k/renderer/src/vulkan/gxm_to_vulkan.cpp'
      - 'vita3k/renderer/src/vulkan/renderer.cpp'
      - 'vita3k/renderer/src/vulkan/pipeline_cache.cpp'
      - 'tools/render-regression/**'
      - '.github/workflows/render-regression.yml'
  pull_request:
    paths:
      - 'vita3k/renderer/src/texture/format.cpp'
      - 'vita3k/renderer/src/texture/cache.cpp'
      - 'vita3k/renderer/src/vulkan/surface_cache.cpp'
      - 'vita3k/renderer/src/vulkan/context.cpp'
      - 'vita3k/renderer/src/vulkan/creation.cpp'
      - 'vita3k/renderer/src/vulkan/scene.cpp'
      - 'vita3k/renderer/include/renderer/vulkan/types.h'
      - 'vita3k/shader/**'
      - 'vita3k/renderer/src/vulkan/gxm_to_vulkan.cpp'
      - 'vita3k/renderer/src/vulkan/renderer.cpp'
      - 'vita3k/renderer/src/vulkan/pipeline_cache.cpp'
      - 'tools/render-regression/**'
      - '.github/workflows/render-regression.yml'
jobs:
  bc-decoder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test production decoder under address and undefined-behavior sanitizers
        run: python3 tools/render-regression/check_bc_decoder.py
      - name: Test surface retirement and RGB staging allocation
        run: python3 tools/render-regression/check_surface_lifecycle.py
      - name: Test packed float upload despite integer format support
        run: python3 tools/render-regression/check_u2f10_upload.py
      - name: Test observed RT aliases and feedback command ordering
        run: python3 tools/render-regression/check_rt_alias_feedback.py
      - name: Test strict shader precision and packed material words
        run: python3 tools/render-regression/check_material_accuracy.py
      - name: Test unaligned uniform copies and literal shuffle indices
        run: python3 tools/render-regression/check_uniform_shuffle.py
      - name: Test iOS synchronous startup and worker teardown policy
        run: python3 tools/render-regression/check_ios_pipeline_stability.py
      - name: Install Vulkan headers for actual descriptor lifetime checks
        run: sudo apt-get update && sudo apt-get install -y libvulkan-dev
      - name: Test production pipeline attachment lifetime with real Vulkan-Hpp
        run: python3 tools/render-regression/check_pipeline_attachment_lifetime.py
